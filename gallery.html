<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Hindustan Foundation &amp; Constructions</title>
    <meta name="description" content="Photos from our piling sites across Bengaluru: rotary rigs, crawler cranes, pile heads, shoring and the crews behind them.">
    <meta name="theme-color" content="#0a0f1c">
    <link rel="icon" href="images/Logo/Logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body class="page" data-page="gallery">
    <header id="site-nav"></header>
    <script src="js/chrome.js"></script>

    <main id="top">
        <section class="ph">
            <div class="wrap">
                <p class="ph-k rise">Gallery</p>
                <h1 class="ph-t rise"><span>On site,</span> <em>in pictures.</em></h1>
                <p class="ph-p rise">Rotary rigs, crawler cranes, pile heads and the crews behind them, from our sites across Bengaluru. Hover a photo for the story, click to open it full screen.</p>
                <div class="g-chips rise" id="g-chips" role="group" aria-label="Filter photos"></div>
            </div>
        </section>

        <section class="g-wrap" aria-label="Photo gallery">
            <div class="g-grid" id="g-grid"></div>
        </section>
    </main>

    <div id="site-foot"></div>

    <!-- Lightbox -->
    <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
        <button class="lb-x" id="lb-x" aria-label="Close">&times;</button>
        <button class="lb-nav prev" id="lb-prev" aria-label="Previous photo">&lsaquo;</button>
        <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
        <button class="lb-nav next" id="lb-next" aria-label="Next photo">&rsaquo;</button>
    </div>

    <script src="js/data.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
